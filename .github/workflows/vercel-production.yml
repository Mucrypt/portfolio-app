name: Vercel Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run build test
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://romeomukulah.org
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID || '' }}
          REDIS_ENABLED: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high || true

  deploy:
    name: Deploy to Vercel Production
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check if Vercel token is configured
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "⚠️ VERCEL_TOKEN not configured - Skipping GitHub Actions deployment"
            echo "ℹ️  Vercel will auto-deploy from GitHub integration"
            echo "deployment_method=vercel_integration" >> $GITHUB_ENV
            exit 0
          fi
          echo "deployment_method=github_actions" >> $GITHUB_ENV

      - name: Setup Node.js
        if: env.deployment_method == 'github_actions'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        if: env.deployment_method == 'github_actions'
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        if: env.deployment_method == 'github_actions'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: env.deployment_method == 'github_actions'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        if: env.deployment_method == 'github_actions'
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $DEPLOYMENT_URL"

      - name: Vercel Integration Deployment
        if: env.deployment_method == 'vercel_integration'
        run: |
          echo "📦 Deployment handled by Vercel GitHub Integration"
          echo "🔗 Monitor at: https://vercel.com/dashboard"
          echo "🌐 Site: https://romeomukulah.org"

      - name: Wait for deployment
        run: |
          echo "Waiting 45s for deployment to stabilize..."
          sleep 45

      - name: Health Check
        run: |
          echo "Running health checks..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://romeomukulah.org/api/health || echo "000")
            if [ $STATUS -eq 200 ]; then
              echo "✅ Health check passed (Status: $STATUS)"
              exit 0
            fi
            echo "⏳ Attempt $i/5: Status $STATUS - Retrying in 10s..."
            sleep 10
          done
          echo "::warning ::Health check endpoint not responding - deployment may still be propagating"
          exit 0

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Site**: https://romeomukulah.org" >> $GITHUB_STEP_SUMMARY
          echo "- **Method**: ${{ env.deployment_method }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Monitor deployment: https://vercel.com/dashboard" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          exit 1
