name: Vercel Preview Deployment

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || true

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run build test
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://preview.romeomukulah.org
          REDIS_ENABLED: false

  deploy-preview:
    name: Deploy Preview
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deployment method
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "ℹ️  VERCEL_TOKEN not configured"
            echo "🔗 Vercel GitHub integration will handle preview deployment"
            echo "deployment_method=vercel_integration" >> $GITHUB_ENV
          else
            echo "deployment_method=github_actions" >> $GITHUB_ENV
          fi

      - name: Setup Node.js
        if: env.deployment_method == 'github_actions'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Vercel CLI
        if: env.deployment_method == 'github_actions'
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        if: env.deployment_method == 'github_actions'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        if: env.deployment_method == 'github_actions'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Preview
        if: env.deployment_method == 'github_actions'
        id: deploy
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "✅ Preview deployed to: $PREVIEW_URL"

      - name: Comment PR with preview URL
        if: env.deployment_method == 'github_actions' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.name,
              body: `## 🚀 Preview Deployment\n\n✅ Your preview is ready!\n\n🔗 **URL**: ${{ steps.deploy.outputs.url }}\n\n---\n*Deployed via GitHub Actions*`
            })

      - name: Vercel Integration Deployment
        if: env.deployment_method == 'vercel_integration'
        run: |
          echo "## 📦 Preview Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Preview deployment handled by Vercel GitHub Integration" >> $GITHUB_STEP_SUMMARY
          echo "Check the PR for the preview URL comment from Vercel bot" >> $GITHUB_STEP_SUMMARY
