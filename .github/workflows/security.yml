name: Security Scanning

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Job 1: Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: npm-audit
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=moderate --json > audit-results.json || true
          npm audit --audit-level=moderate || echo "⚠️ Vulnerabilities found"

      - name: Check for critical vulnerabilities
        run: |
          CRITICAL=$(cat audit-results.json | grep -o '"critical":[0-9]*' | cut -d':' -f2 || echo "0")
          HIGH=$(cat audit-results.json | grep -o '"high":[0-9]*' | cut -d':' -f2 || echo "0")
          echo "Critical: $CRITICAL, High: $HIGH"
          if [ "$CRITICAL" -gt "0" ]; then
            echo "::warning ::Found $CRITICAL critical vulnerabilities"
          fi

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-results
          path: audit-results.json
          retention-days: 30

  # Job 2: Environment variables check
  env-check:
    name: Environment Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for exposed secrets in code
        run: |
          echo "Checking for common secret patterns..."
          ! grep -r "SUPABASE_SERVICE_ROLE_KEY" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" app/ components/ lib/ || echo "::warning ::Potential secret found"
          ! grep -r "sk_live_" --include="*.ts" --include="*.tsx" app/ components/ lib/ || echo "::warning ::Potential Stripe key found"
          ! grep -r "mongodb://" --include="*.ts" --include="*.tsx" app/ components/ lib/ || echo "::warning ::Potential DB connection string found"
          echo "✅ Secret pattern check complete"

      - name: Verify .env files are gitignored
        run: |
          if git ls-files | grep -E "\.env$|\.env\.local$"; then
            echo "::error ::.env files should not be committed!"
            exit 1
          fi
          echo "✅ No .env files in repository"

  # Job 3: Security summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, env-check]
    if: always()

    steps:
      - name: Generate security report
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependency Scan**: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment Check**: ${{ needs.env-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Scan Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.dependency-scan.result }}" = "success" ] && [ "${{ needs.env-check.result }}" = "success" ]; then
            echo "✅ All security checks passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Some checks require attention" >> $GITHUB_STEP_SUMMARY
          fi
