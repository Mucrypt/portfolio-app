name: Security Scanning

on:
  schedule:
  # Run daily at 2 AM UTC
  - cron: '0 2 * * *'
  push:
    branches:
    - main
  workflow_dispatch:


permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  # Job 1: Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: |
        npm audit --json > npm-audit.json || true
        npm audit --audit-level=moderate

    - name: Snyk vulnerability scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=medium --json-file-output=snyk-report.json

    - name: Upload scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-scan-results
        path: |
          npm-audit.json
          snyk-report.json
        retention-days: 30

  # Job 2: Container image scanning
  container-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t portfolio-app:scan .

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'portfolio-app:scan'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run Grype scanner
      uses: anchore/scan-action@v3
      with:
        image: 'portfolio-app:scan'
        fail-build: false
        severity-cutoff: high

  # Job 3: Code quality and security analysis
  code-analysis:
    name: Code Quality & Security Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=Mucrypt_portfolio-app -Dsonar.organization=mucrypt -Dsonar.sources=app,components,lib -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,**/node_modules/**
      continue-on-error: true

    - name: CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: javascript,typescript

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # Job 4: Secret scanning
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD

    - name: GitLeaks Secret Scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 5: Security summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [ dependency-scan, container-scan, code-analysis, secret-scan ]
    if: always()

    steps:
    - name: Generate security report
      run: |
        echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "- **Dependency Scan**: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Container Scan**: ${{ needs.container-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Code Analysis**: ${{ needs.code-analysis.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Secret Scan**: ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "📊 **Scan Date**: $(date)" >> $GITHUB_STEP_SUMMARY

    - name: Notify security team on failure
      if: |
        needs.dependency-scan.result == 'failure' ||
        needs.container-scan.result == 'failure' ||
        needs.secret-scan.result == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: 'failure'
        text: '⚠️ Security vulnerabilities detected! Please review the security scan results.'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      continue-on-error: true
