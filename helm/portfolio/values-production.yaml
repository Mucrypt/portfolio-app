# Override values for production environment

environment: production

replicaCount: 3

image:
  tag: "latest"

ingress:
  host: romeomukulah.org
  hosts:
  - host: romeomukulah.org
    paths:
    - path: /
      pathType: Prefix
  - host: www.romeomukulah.org
    paths:
    - path: /
      pathType: Prefix
  tls:
    secretName: romeomukulah-tls

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

env:
- name: NODE_ENV
  value: "production"
- name: PORT
  value: "3000"
- name: NEXT_PUBLIC_SITE_URL
  value: "https://romeomukulah.org"
