apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
  namespace: portfolio-production
  labels:
    app: portfolio
    tier: application
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: ClusterIP
  selector:
    app: portfolio
    tier: application
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service-headless
  namespace: portfolio-production
  labels:
    app: portfolio
    tier: application
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: portfolio
    tier: application
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
