apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-app
  namespace: portfolio-production
  labels:
    app: portfolio
    tier: application
    environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
      tier: application
  template:
    metadata:
      labels:
        app: portfolio
        tier: application
        environment: production
    spec:
      containers:
      - name: placeholder
        image: nginx:1.27-alpine
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
