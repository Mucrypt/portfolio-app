name: CD - Deploy to Staging

on:
  push:
    branches:
    - develop
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual deployment'

env:
  REGISTRY: ghcr.io
  KUBE_NAMESPACE: portfolio-staging

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.romeomukulah.org

    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compute image repository (lowercase)
      id: image_repo
      run: |
        echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig \
          --region ${{ secrets.AWS_REGION }} \
          --name ${{ secrets.EKS_CLUSTER_NAME }}

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.13.0'

    - name: Create namespace if not exists
      run: |
        kubectl create namespace ${{ env.KUBE_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Create Docker registry secret
      run: |
        if kubectl -n ${{ env.KUBE_NAMESPACE }} get secret ghcr-secret >/dev/null 2>&1; then
          echo "✅ ghcr-secret already exists; skipping creation"
          exit 0
        fi

        if [[ -z "${{ secrets.GHCR_TOKEN }}" ]]; then
          echo "❌ Missing required secret: GHCR_TOKEN (needs read:packages) and ghcr-secret does not exist"
          exit 1
        fi
        USERNAME="${{ secrets.GHCR_USERNAME || github.repository_owner }}"
        PASSWORD="${{ secrets.GHCR_TOKEN }}"
        kubectl create secret docker-registry ghcr-secret \
          --docker-server=${{ env.REGISTRY }} \
          --docker-username="$USERNAME" \
          --docker-password="$PASSWORD" \
          --namespace=${{ env.KUBE_NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Create application secrets
      run: |
        kubectl create secret generic app-secrets \
          --from-literal=NEXT_PUBLIC_SUPABASE_URL="${{ secrets.STAGING_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
          --from-literal=NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.STAGING_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
          --namespace=${{ env.KUBE_NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy with Helm
      run: |
        helm upgrade --install portfolio ./helm/portfolio \
          --namespace ${{ env.KUBE_NAMESPACE }} \
          --set image.repository=${{ env.REGISTRY }}/${{ steps.image_repo.outputs.repo }} \
          --set image.tag=${{ github.sha }} \
          --set environment=staging \
          --set ingress.hosts[0].host=staging.romeomukulah.org \
          --set ingress.hosts[0].paths[0].path=/ \
          --set ingress.hosts[0].paths[0].pathType=Prefix \
          --set ingress.hosts[1].host=www.staging.romeomukulah.org \
          --set ingress.hosts[1].paths[0].path=/ \
          --set ingress.hosts[1].paths[0].pathType=Prefix \
          --set ingress.tls.enabled=true \
          --set ingress.tls.secretName=staging-romeomukulah-tls \
          --set replicaCount=2 \
          --set resources.requests.cpu=100m \
          --set resources.requests.memory=256Mi \
          --set resources.limits.cpu=500m \
          --set resources.limits.memory=512Mi \
          --wait \
          --timeout 5m

    - name: Verify deployment
      run: |
        kubectl rollout status deployment/portfolio \
          --namespace=${{ env.KUBE_NAMESPACE }} \
          --timeout=5m

    - name: Run smoke tests
      run: |
        STAGING_URL="https://staging.romeomukulah.org"

        echo "Running smoke tests against $STAGING_URL"

        # Wait for service to be ready
        sleep 30

        # Test health endpoint
        if curl -f -s "$STAGING_URL/api/health" | grep -q "healthy"; then
          echo "✅ Health check passed"
        else
          echo "❌ Health check failed"
          exit 1
        fi

        # Test homepage
        if curl -f -s "$STAGING_URL" | grep -q "<!DOCTYPE html>"; then
          echo "✅ Homepage accessible"
        else
          echo "❌ Homepage not accessible"
          exit 1
        fi

    - name: Post deployment summary
      if: always()
      run: |
        echo "## Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: Staging" >> $GITHUB_STEP_SUMMARY
        echo "- **Namespace**: ${{ env.KUBE_NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image Tag**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **URL**: https://staging.romeomukulah.org" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Deployment Status" >> $GITHUB_STEP_SUMMARY
        kubectl get pods -n ${{ env.KUBE_NAMESPACE }} >> $GITHUB_STEP_SUMMARY || true

    - name: Notify deployment status
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Staging deployment failed!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      continue-on-error: true
