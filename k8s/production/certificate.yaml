apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    # Production Let's Encrypt server
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@romeomukulah.org

    # Store account key in this secret
    privateKeySecretRef:
      name: letsencrypt-prod

    # Enable HTTP-01 challenge provider
    solvers:
    - http01:
        ingress:
          class: nginx
      selector: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    # Staging Let's Encrypt server (for testing)
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@romeomukulah.org

    privateKeySecretRef:
      name: letsencrypt-staging

    solvers:
    - http01:
        ingress:
          class: nginx
      selector: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: romeomukulah-cert
  namespace: portfolio-production
spec:
  secretName: romeomukulah-tls

  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

  commonName: romeomukulah.org

  dnsNames:
  - romeomukulah.org
  - www.romeomukulah.org

  duration: 2160h # 90 days
  renewBefore: 720h # 30 days

  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
    rotationPolicy: Always
